<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 5 — Віджет погоди</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="weather-widget">
    <div class="main-card">
        <div class="nav-arrows">
            <button class="arrow-btn">&larr;</button>
            <button class="arrow-btn">&rarr;</button>
        </div>

        <div class="cloud-image"></div>

        <div class="current-temp">17°</div>
    </div>

    <div class="forecast-card">
        <div class="forecast-day">
            <span class="day-name">Mon</span>
            <span class="day-temp">17°</span>
        </div>
        <div class="forecast-day">
            <span class="day-name">Tue</span>
            <span class="day-temp">19°</span>
        </div>
        <div class="forecast-day">
            <span class="day-name">Wed</span>
            <span class="day-temp">16°</span>
        </div>
        <div class="forecast-day">
            <span class="day-name">Thu</span>
            <span class="day-temp">18°</span>
        </div>
        <div class="forecast-day">
            <span class="day-name">Fri</span>
            <span class="day-temp">21°</span>
        </div>
    </div>
</div>

</body>
</html>

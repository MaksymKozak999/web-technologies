<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 6-6: Popup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
    <a class="header-link" href="#" tabindex="0">Mail</a>
    <a class="header-link" href="#" tabindex="0">Images</a>

    <input class="popup-toggle" type="checkbox" id="popup-toggle" tabindex="0" aria-label="Apps">
    <label class="popup-button" for="popup-toggle"></label>

    <div class="popup">
        <div class="popup-scroll" tabindex="0">
            <div class="icon-grid">
                <a class="icon-item" href="#" tabindex="0"><span class="icon">📅</span><span class="icon-label">Calendar</span></a>
                <a class="icon-item" href="#" tabindex="0"><span class="icon">✉️</span><span class="icon-label">Mail</span></a>
                <a class="icon-item" href="#" tabindex="0"><span class="icon">📰</span><span class="icon-label">News</span></a>
                <a class="icon-item" href="#" tabindex="0"><span class="icon">🗺️</span><span class="icon-label">Map</span></a>
                <a class="icon-item" href="#" tabindex="0"><span class="icon">📁</span><span class="icon-label">Files</span></a>
                <a class="icon-item" href="#" tabindex="0"><span class="icon">👤</span><span class="icon-label">Contacts</span></a>
                <a class="icon-item" href="#" tabindex="0"><span class="icon">🌐</span><span class="icon-label">Translate</span></a>
                <a class="icon-item" href="#" tabindex="0"><span class="icon">▶️</span><span class="icon-label">Videos</span></a>
                <a class="icon-item" href="#" tabindex="0"><span class="icon">🔍</span><span class="icon-label">Search</span></a>
                <a class="icon-item" href="#" tabindex="0"><span class="icon">👥</span><span class="icon-label">Photos</span></a>
                <a class="icon-item" href="#" tabindex="0"><span class="icon">🎨</span><span class="icon-label">Apps</span></a>
                <a class="icon-item" href="#" tabindex="0"><span class="icon">📄</span><span class="icon-label">Documents</span></a>
            </div>

            <div class="extra">
                <div class="icon-grid">
                    <a class="icon-item" href="#" tabindex="0"><span class="icon">💬</span><span class="icon-label">Chat</span></a>
                    <a class="icon-item" href="#" tabindex="0"><span class="icon">🎓</span><span class="icon-label">Classroom</span></a>
                    <a class="icon-item" href="#" tabindex="0"><span class="icon">⭐</span><span class="icon-label">Collection</span></a>
                    <a class="icon-item" href="#" tabindex="0"><span class="icon">🔴</span><span class="icon-label">Mars</span></a>
                    <a class="icon-item" href="#" tabindex="0"><span class="icon">📝</span><span class="icon-label">Blogs</span></a>
                    <a class="icon-item" href="#" tabindex="0"><span class="icon">📢</span><span class="icon-label">Promos</span></a>
                </div>
                <a class="even-more" href="#" tabindex="0">Even more from Kottans</a>
            </div>
        </div>

        <div class="popup-footer">
            <input class="more-toggle" type="checkbox" id="more-toggle" tabindex="0" aria-label="More">
            <label class="more-button" for="more-toggle">More</label>
        </div>
    </div>

    <a class="bell" href="#" tabindex="0" aria-label="Notifications">🔔</a>
    <a class="avatar" href="#" tabindex="0" aria-label="Profile">M</a>
</header>
</body>
</html>
